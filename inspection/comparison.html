<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans)}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.controls button{font:inherit;font-size:12px;border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;color:var(--foreground);background:var(--secondary);cursor:pointer}.controls button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}.stage{position:relative;width:100%;margin:auto;line-height:0}.stage img{width:100%;height:auto;display:block}.stage .local{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}.stage:after{content:'';position:absolute;top:0;bottom:0;left:var(--split,50%);width:2px;background:var(--primary);pointer-events:none}.stage[hidden]{display:none}.slider{display:flex;gap:16px;align-items:center;margin-top:12px;font-size:12px;color:var(--muted-foreground)}input{flex:1;min-width:60px;accent-color:var(--primary)}.caption{display:flex;justify-content:space-between;color:var(--muted-foreground);font-size:12px;margin-bottom:8px}
</style></head><body><div class="controls" aria-label="Comparison viewport"><button data-width="1440" aria-pressed="true">Desktop · 1440</button><button data-width="768" aria-pressed="false">Tablet · 768</button><button data-width="390" aria-pressed="false">Mobile · 390</button></div><div class="caption"><span>Pruven recreation</span><span>Onda reference</span></div><div class="stage" data-stage="1440" style="max-width:1440px" ><img alt="Onda reference at 1440 pixels" src="/home/himmel/personal/pruven/inspection/reference/1440-hero.png"><img class="local" alt="Pruven recreation at 1440 pixels" src="/home/himmel/personal/pruven/inspection/local/1440-hero.png"></div><div class="stage" data-stage="768" style="max-width:768px" hidden><img alt="Onda reference at 768 pixels" src="/home/himmel/personal/pruven/inspection/reference/768-hero.png"><img class="local" alt="Pruven recreation at 768 pixels" src="/home/himmel/personal/pruven/inspection/local/768-hero.png"></div><div class="stage" data-stage="390" style="max-width:390px" hidden><img alt="Onda reference at 390 pixels" src="/home/himmel/personal/pruven/inspection/reference/390-hero.png"><img class="local" alt="Pruven recreation at 390 pixels" src="/home/himmel/personal/pruven/inspection/local/390-hero.png"></div><label class="slider"><span>Reference</span><input type="range" min="0" max="100" value="50" aria-label="Reveal Pruven screenshot"><span>Pruven</span></label><script>
const range=document.querySelector('input');function split(){document.querySelectorAll('.stage').forEach(s=>{s.style.setProperty('--split',range.value+'%');s.querySelector('.local').style.clipPath='inset(0 '+(100-range.value)+'% 0 0)'})}range.addEventListener('input',split);document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('.stage').forEach(s=>s.hidden=s.dataset.stage!==b.dataset.width)}));
</script></body></html>
